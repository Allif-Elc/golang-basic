user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    proxy_cache_path /var/cache/nginx/api keys_zone=api_cache:10m levels=1:2 inactive=60m max_size=1g use_temp_path=off;
    proxy_cache_path /var/cache/nginx/static keys_zone=static_cache:10m inactive=24h max_size=5g;

    upstream go_backend {
        server app:3003;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://go_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache api_cache;
            proxy_cache_valid 200 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location /static/ {
            proxy_cache static_cache;
            proxy_cache_valid 200 24h;
            expires 1y;
            add_header Cache-Control "public, immutable";
            proxy_pass http://go_backend;
        }

        location /health {
            access_log off;
            proxy_pass http://go_backend;
        }
    }
}
